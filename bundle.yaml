bundle:
  name: lsp-rust
  version: 2.0.0
  description: "DEPRECATED: Consolidated into rust-dev. This bundle forwards automatically."

includes:
  - bundle: git+https://github.com/microsoft/amplifier-bundle-rust-dev@main

hooks:
  - module: hooks-deprecation
    source: git+https://github.com/microsoft/amplifier-foundation@main#subdirectory=modules/hooks-deprecation
    config:
      bundle_name: lsp-rust
      replacement: amplifier-bundle-rust-dev
      message: "amplifier-bundle-lsp-rust has been consolidated into amplifier-bundle-rust-dev"
      migration: |
        Update your includes:
        -   - bundle: git+https://github.com/microsoft/amplifier-bundle-lsp-rust@main
        +   - bundle: git+https://github.com/microsoft/amplifier-bundle-rust-dev@main
      severity: warning
